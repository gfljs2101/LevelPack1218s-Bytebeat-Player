name: Dependabot Auto-Merge & Conflict Resolver

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main] # Change to 'master' if your default branch uses that name

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.event_name == 'push'
    steps:
      # Step 1: Detect conflicts and force Dependabot to regenerate clean code
      - name: Force Dependabot Rebase on Conflict
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            for (const pr of prs) {
              if (pr.user.login === 'dependabot[bot]') {
                const { data: detailedPR } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number
                });

                // 'dirty' means there is a merge conflict
                if (detailedPR.mergeable_state === 'dirty') {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: '@dependabot rebase'
                  });
                }
              }
            }

      # Step 2: Instantly queue the PR for merging if it is conflict-free
      - name: Auto-Merge Clean PRs
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
